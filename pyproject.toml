[project]
name = "democracy-bench"
version = "0.1.0"
description = "A survey-grounded harness that tests, across a ladder of alignment levers (context, decode, activation, weights, scaffold), whether an LLM can carry per-item public democratic preference while holding rights floors — scored on two axes: representation and tracking elasticity."
authors = [
    { name = "Alejandro Beltran" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "inspect-ai>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
# Optional: full hierarchical multinomial estimator for presentation-grade posteriors.
# NOT needed for the demo or to run the experiment — estimation.py ships a pure-numpy
# Dirichlet-multinomial + empirical-Bayes path. Install (`pip install -e '.[bayes]'`) only
# when writing up external claims; pymc is a heavy build (pytensor + compiler toolchain).
bayes = [
    "pymc>=5.10",
]
# Needed only to run the Inspect tasks against OpenRouter live (`inspect eval ... --model
# openrouter/...`). The standalone drivers reach OpenRouter via urllib and don't need this.
openrouter = [
    "openai>=1.0",
]
# Needed only to render the paper figures (scripts/make_paper_figures.py). The extraction and
# verification path is pure-numpy and does not need this; install (`pip install -e '.[figures]'`)
# only when regenerating figures.
figures = [
    "matplotlib>=3.7",
]

[project.scripts]
# Console entry points for the standalone drivers. The three MLX-touching drivers import mlx
# lazily inside main(), so the entry points resolve without Apple Silicon; running them still
# requires MLX. extract-paper-results is pure numpy/stdlib.
policy_delegate_stress = "alignment.policy_delegate_stress:main"
activation_steering_run = "alignment.activation_steering_run:main"
evidcond_run = "alignment.evidcond_run:main"
extract-paper-results = "scripts.extract_paper_results:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alignment", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
